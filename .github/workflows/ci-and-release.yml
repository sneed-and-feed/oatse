name: Cross-Platform CI & Pre-Packaged Binary Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-matrix:
    name: Pytest, Math Audit & Peak Heap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & OATSE dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install -e ".[dev]"
          else
            pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
          fi
        shell: bash

      - name: Run GFM / KaTeX Math Compliance Audit
        run: python scripts/audit_gfm_math.py README.md docs/ARCHITECTURE.md
        shell: bash

      - name: Verify Formal Runtime Invariants
        run: python -c "from oatse.engine import OATSEModel; m = OATSEModel(); res = m.verify_formal_theorems(); assert all(v['passed'] for v in res.values()), res"
        shell: bash

      - name: Verify 5-Scenario Maritime Deck & NOAA XBT Data
        run: python -c "from oatse.scenarios import build_all_scenarios; s = build_all_scenarios(); assert len(s) == 5"
        shell: bash

      - name: Run Cross-Platform Pytest Verification Suite
        run: pytest tests/test_oatse.py -v
        shell: bash

      - name: Run Full Mode A & Mode B Evaluation Benchmark
        run: python scripts/evaluate_oatse.py
        shell: bash

  build-binaries:
    name: Build Standalone Binary (${{ matrix.target_name }})
    needs: test-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: oatse-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target_name: oatse-macos-arm64
            ext: ""
          - os: ubuntu-latest
            target_name: oatse-linux-x86_64
            ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OATSE, Build Tooling & PyInstaller
        run: |
          python -m pip install --upgrade pip build
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install -e . pyinstaller
          else
            pip install --extra-index-url https://download.pytorch.org/whl/cpu -e . pyinstaller
          fi
        shell: bash

      - name: Package Single-File Executable & Portable HTML5 Studio
        run: |
          python -m PyInstaller --noconfirm --clean --onefile \
            --name "${{ matrix.target_name }}" \
            --add-data "data/noaa_xbt:data/noaa_xbt" \
            oatse/__main__.py
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            python -m oatse export-studio --output-dir dist
            python -m build
          fi
        shell: bash

      - name: Smoke-Test Packaged Binary
        run: |
          ./dist/${{ matrix.target_name }}${{ matrix.ext }} scenarios list
          ./dist/${{ matrix.target_name }}${{ matrix.ext }} scenarios inspect --scenario munk_sofar_shadow_zone
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release Assets
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Pre-Packaged Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/oatse-windows-x86_64.exe
            release-assets/oatse-macos-arm64
            release-assets/oatse-linux-x86_64
            release-assets/oatse_portable_studio.html
            release-assets/*.whl
            release-assets/*.tar.gz
          generate_release_notes: true
